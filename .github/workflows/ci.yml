name: SparkShield Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-and-dashboard-verification:
    name: Python Models, Protocol & Dashboard CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite (Python Core & Models)
        run: python -m pytest python_core/tests models/tests -v

      - name: Verify Android Feature & Protocol Parity
        run: python tests/verify_android_parity.py

      - name: Verify Phase 4 WebSocket Publisher & Server
        run: python tests/verify_phase4.py

      - name: Verify Phase 5 Virtual BLE Transport (Bumble LocalLink)
        run: python tests/verify_phase5_ble.py

      - name: Verify Phase 6 Room Database & Node-RED Adapter
        run: python tests/verify_phase6.py

      - name: Verify Phase 7 QNN Host Parity & Resilience
        run: python tests/verify_phase7_qnn.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        run: cd dashboard && npm install

      - name: Run Dashboard Unit Tests
        run: cd dashboard && npm test

      - name: Build Dashboard Production Bundle
        run: cd dashboard && npm run build

  android-build-and-lint:
    name: Android Edge NDK & JVM Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: |
          cd android_app
          gradle test --stacktrace

      - name: Run Android Lint Checks
        run: |
          cd android_app
          gradle lint --stacktrace

      - name: Assemble Android Debug APK
        run: |
          cd android_app
          gradle assembleDebug --stacktrace
