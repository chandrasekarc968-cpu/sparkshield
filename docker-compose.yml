version: "3.8"

services:
  virtual-meter:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY python_core/ /app/python_core/
        COPY artifacts/ /app/artifacts/
        RUN pip install --no-cache-dir numpy scipy onnxruntime
        EXPOSE 9002 8765
        CMD ["python", "-m", "python_core.mock_ws_server", "--port", "8765"]
    ports:
      - "8765:8765"
      - "9002:9002"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build:
      context: ./dashboard
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY . /app/
        RUN npm install && npm run build
        EXPOSE 3000
        CMD ["npm", "run", "preview"]
    ports:
      - "3000:3000"
    depends_on:
      - virtual-meter
